<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>课序 · 学生选课小程序（预览）</title>
<style>
  :root{
    --green:#07c160; --green-d:#059b4d; --teal:#17384b; --bg:#f3f7f4;
    --ink:#17384b; --sub:#75877d; --line:#e1e9e4; --card:#fff;
    --mint:#07c160; --blue:#2f8fe0; --amber:#f0a020; --violet:#8a6cf0; --coral:#ef6f5b; --navy:#3a5fa8;
    --danger:#d75b43;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#dfe7e2;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center;padding:24px 12px}
  /* 手机外框 */
  .phone{width:402px;height:844px;background:var(--bg);border-radius:44px;box-shadow:0 22px 60px rgba(23,56,75,.28);overflow:hidden;position:relative;display:flex;flex-direction:column;border:10px solid #0c1f29}
  .statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:13px;font-weight:600;color:#fff;background:var(--green)}
  .statusbar .dots{display:flex;gap:5px}
  .statusbar .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.85)}
  .screen{flex:1;overflow-y:auto;position:relative;background:var(--bg)}
  .screen::-webkit-scrollbar{width:0}
  .navbar{height:48px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--green);color:#fff;font-size:17px;font-weight:700;position:relative}
  .navbar .back{position:absolute;left:12px;font-size:15px;padding:6px 10px}
  .navbar .right{position:absolute;right:14px;font-size:14px}

  /* 通用卡片 */
  .page{padding:14px}
  .card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(23,56,75,.05)}
  .badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:#eef1f5;color:#59677a}
  .badge.ok{background:#e1f7eb;color:#078d4e}
  .badge.amber{background:#fff3dc;color:#8a5100}
  .badge.gray{background:#eef1f5;color:#59677a}
  .empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px;line-height:1.8}

  /* 登录 */
  .login-wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 36px;background:linear-gradient(160deg,#07c160,#0a9b58)}
  .logo{width:96px;height:96px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:var(--green);box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .school{color:#fff;margin-top:18px;font-size:20px;font-weight:800}
  .slogan{color:rgba(255,255,255,.85);font-size:13px;margin-top:6px}
  .login-card{width:100%;background:#fff;border-radius:22px;padding:22px;margin-top:30px;box-shadow:0 14px 40px rgba(0,0,0,.2)}
  .field{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:50px;margin-bottom:14px}
  .field input{flex:1;border:none;outline:none;font-size:15px;background:transparent;color:var(--ink)}
  .btn{width:100%;height:50px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--green)}
  .btn:active{opacity:.85}
  .btn[disabled]{background:#c7d2cc;color:#fff}
  .hint{color:#0a6e3e;font-size:12px;margin-top:14px;text-align:center;line-height:1.7}
  .role-seg{display:flex;gap:8px;margin-bottom:16px}
  .role-seg div{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);font-size:14px;color:var(--sub)}
  .role-seg div.on{background:#e1f7eb;border-color:#bfe7d1;color:var(--green-d);font-weight:700}

  /* 大厅 */
  .summary{display:flex;align-items:center;gap:16px;background:var(--teal);color:#fff;padding:18px 20px;border-radius:18px;margin-bottom:14px}
  .summary .num{font-size:30px;font-weight:800}
  .summary .lab{font-size:12px;color:rgba(255,255,255,.6)}
  .summary .div{width:1px;height:34px;background:rgba(255,255,255,.14);margin:0 4px}
  .summary .grow{margin-left:auto;font-size:12px;color:#79efb1}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 12px}
  .section-title h3{margin:0;font-size:17px}
  .section-title .sub{font-size:12px;color:var(--sub);margin-top:3px}
  .search{width:100%;height:42px;padding:0 16px;border:1px solid var(--line);border-radius:14px;font-size:14px;outline:none;background:#fff}
  .chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px}
  .chips::-webkit-scrollbar{height:0}
  .chip{flex:none;padding:7px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub);font-size:13px;white-space:nowrap}
  .chip.on{background:#e1f7eb;color:var(--green-d);border-color:#bfe7d1;font-weight:700}
  .chip.tg{margin-left:6px;border-style:dashed}
  .chip.tg.on{background:#fff3dc;color:#8a5100;border-color:#f0d9a8;border-style:solid}

  /* 课程卡片 */
  .ccard{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;gap:12px;box-shadow:0 4px 16px rgba(23,56,75,.05)}
  .ccard .mark{width:54px;height:54px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff}
  .ccard .body{flex:1;min-width:0}
  .ccard .nm{font-size:16px;font-weight:700}
  .ccard .mt{font-size:12px;color:var(--sub);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ccard .foot{display:flex;align-items:center;margin-top:10px;gap:8px}
  .progress{flex:1;height:6px;border-radius:6px;background:#eef1f5;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--green)}
  .remain{font-size:12px;color:var(--sub);white-space:nowrap}
  .remain b{color:var(--green-d)}
  .pill{padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700;border:none}
  .pill.go{background:var(--green);color:#fff}
  .pill.full{background:#eef1f5;color:#9aa7a0}
  .pill.enrolled{background:#e1f7eb;color:#078d4e}

  /* 详情 overlay */
  .overlay{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s ease}
  .overlay.show{transform:translateX(0)}
  .hero{padding:22px;display:flex;align-items:center;gap:14px}
  .hero .mark{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;flex:none}
  .hero .cat{font-size:12px;color:var(--sub)}
  .hero .nm{font-size:20px;font-weight:800;margin:3px 0 8px}
  .info-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f0f3f1;font-size:14px}
  .info-row .k{color:var(--sub)}
  .info-row .v{font-weight:600}
  .info-row .v.ok{color:#078d4e}.info-row .v.bad{color:var(--danger)}
  .alert{background:#fff4f1;border:1px solid #f6cfc4;color:#c0492e;font-size:13px;padding:12px 14px;border-radius:12px;line-height:1.6}
  .actionbar{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line)}
  .actionbar button{width:100%;height:48px;border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--green)}
  .actionbar button.danger{background:var(--danger)}
  .actionbar button[disabled]{background:#c7d2cc}
  .spacer{height:80px}

  /* 我的课程 */
  .enr{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center}
  .enr .mark{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
  .enr .body{flex:1;min-width:0}
  .enr .nm{font-size:15px;font-weight:700}
  .enr .mt{font-size:12px;color:var(--sub);margin-top:3px}
  .enr .quit{padding:7px 14px;border:1px solid #f0cfc4;color:var(--danger);background:#fff;border-radius:999px;font-size:13px;font-weight:700}
  .hist{font-size:12px;color:var(--sub);padding:8px 4px;border-bottom:1px dashed var(--line)}

  /* 课表 */
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
  .seg div{flex:1;text-align:center;padding:6px 0;border-radius:999px;font-size:13px;color:var(--sub)}
  .seg div.on{background:var(--green);color:#fff;font-weight:700}
  .tbl{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
  .trow{display:flex}
  .trow.head{background:var(--teal)}
  .trow.head .tc{color:#fff;font-weight:700}
  .trow:not(.head){border-top:1px solid #eef2f0}
  .tc{width:62px;min-height:52px;flex:1;padding:6px 4px;font-size:11px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;border-left:1px solid #eef2f0}
  .tc:first-child{border-left:none}
  .tc.corner{background:var(--teal);color:#fff}
  .tc.per{background:#f6f9f7;color:var(--sub);font-weight:700}
  .tc .cn{font-weight:700;color:var(--ink);line-height:1.2}
  .tc .cv{color:#75877d;margin-top:2px}
  .listitem{display:flex;align-items:center;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;border-left:6px solid var(--green);box-shadow:0 3px 12px rgba(23,56,75,.05)}
  .listitem .when{width:64px;flex:none;text-align:center}
  .listitem .day{font-size:15px;font-weight:700}
  .listitem .per{font-size:11px;color:var(--sub);margin-top:2px}
  .listitem .main{flex:1;padding-left:14px;border-left:1px solid var(--line)}
  .listitem .nm{font-size:15px;font-weight:700}
  .listitem .mt{font-size:12px;color:var(--sub);margin-top:3px}

  /* 个人中心 */
  .profile-head{display:flex;align-items:center;gap:14px;background:var(--teal);color:#fff;padding:22px;border-radius:18px;margin-bottom:14px}
  .avatar{width:58px;height:58px;border-radius:50%;background:#07c160;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff}
  .menu{background:#fff;border-radius:16px;overflow:hidden}
  .menu .mi{display:flex;align-items:center;padding:15px 16px;border-bottom:1px solid #f0f3f1;font-size:15px}
  .menu .mi:last-child{border-bottom:none}
  .menu .mi .arrow{margin-left:auto;color:#c2ccc6}
  .menu .mi .ic{width:24px;text-align:center;margin-right:10px;color:var(--green)}

  /* 改密 overlay */
  .toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.8);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80%;text-align:center}
  .toast.show{opacity:1}
  .loading{position:absolute;inset:0;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;z-index:40;font-size:14px;color:var(--sub)}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>
  <div class="navbar" id="navbar"><span id="navTitle">课序</span><span class="back" id="navBack" style="display:none" onclick="goBack()">‹ 返回</span></div>
  <div class="screen" id="screen"></div>
  <div id="tabbar"></div>
  <div class="toast" id="toast"></div>
  <div class="loading" id="loading" style="display:none">加载中…</div>
</div>

<script>
const API = 'http://localhost:3000';
const TONES = ['mint','blue','amber','violet','coral','navy'];
const TONE_COLOR = {mint:'#07c160',blue:'#2f8fe0',amber:'#f0a020',violet:'#8a6cf0',coral:'#ef6f5b',navy:'#3a5fa8'};
const WEEK = ['周一','周二','周三','周四','周五'];

let state = { token:null, userType:null, mustChange:false, username:null, profile:null,
  tab:'hall', hall:{q:'',cat:'',onlyAvail:false,courses:[],cats:[]}, stack:[] };

/* ---------- 工具 ---------- */
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toneOf(id){return TONES[(id||0)%TONES.length];}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function showLoading(b){document.getElementById('loading').style.display=b?'flex':'none';}

async function api(method, path, body){
  const opt={method, headers:{'Content-Type':'application/json'}};
  if(state.token) opt.headers.Authorization='Bearer '+state.token;
  if(body) opt.body=JSON.stringify(body);
  const res=await fetch(API+path, opt);
  let json; try{json=await res.json();}catch(e){json={};}
  if(res.status===401 && path!=='/api/auth/login'){ // 登录失效
    state.token=null; renderLogin(); throw new Error('请重新登录');
  }
  return json;
}

/* ---------- 渲染：登录 ---------- */
function renderLogin(){
  state.tab=null; renderTabbar();
  setNav('课序', false);
  const s=document.getElementById('screen');
  s.innerHTML='';
  const wrap=el(`<div class="login-wrap">
    <div class="logo">课</div>
    <div class="school">铁英中学校本选课</div>
    <div class="slogan">课序 · 学生选课小程序</div>
    <div class="login-card">
      <div class="role-seg">
        <div id="r-stu" class="on" onclick="pickRole('STUDENT')">学生登录</div>
        <div id="r-adm" onclick="pickRole('STAFF')">教职工</div>
      </div>
      <div class="field"><input id="inp-user" placeholder="学号 / 账号" value="20260108"></div>
      <div class="field"><input id="inp-pwd" type="password" placeholder="密码" value="123456"></div>
      <button class="btn" onclick="doLogin()">登 录</button>
      <div class="hint">演示账号<br>学生：20260108 / 123456 ·　教职工：admin / demo123456<br>（首次登录需改密）</div>
    </div>
  </div>`);
  s.appendChild(wrap);
}
function pickRole(r){
  state.userType=r;
  document.getElementById('r-stu').classList.toggle('on', r==='STUDENT');
  document.getElementById('r-adm').classList.toggle('on', r==='STAFF');
  document.getElementById('inp-user').value = r==='STUDENT'?'20260108':'admin';
  document.getElementById('inp-pwd').value = r==='STUDENT'?'123456':'demo123456';
}
async function doLogin(){
  const username=document.getElementById('inp-user').value.trim();
  const password=document.getElementById('inp-pwd').value;
  if(!username||!password){toast('请输入账号和密码');return;}
  showLoading(true);
  try{
    const r=await api('POST','/api/auth/login',{username,password});
    if(r.code!=='OK'){toast(r.message||'登录失败');return;}
    state.token=r.data.token; state.userType=r.data.user_type; state.mustChange=r.data.must_change_password; state.username=r.data.username;
    if(state.mustChange){ openChangePwd(true); return; }
    enterApp();
  }catch(e){toast(e.message||'网络错误');}
  finally{showLoading(false);}
}

/* ---------- 进入应用 ---------- */
function enterApp(){
  state.tab='hall';
  renderTabbar();
  loadProfile().then(()=>renderHall());
}
async function loadProfile(){
  try{ state.profile = await api('GET','/api/me/profile'); }catch(e){}
}

/* ---------- 底部 Tab ---------- */
function renderTabbar(){
  const bar=document.getElementById('tabbar');
  if(!state.tab){bar.innerHTML='';return;}
  const tabs=[['hall','课程','📚'],['mine','我的课程','📋'],['schedule','课表','🗓️'],['profile','我的','👤']];
  bar.style.cssText='flex:none;display:flex;background:#fff;border-top:1px solid var(--line)';
  bar.innerHTML=tabs.map(t=>`<div onclick="switchTab('${t[0]}')" style="flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:${state.tab===t[0]?'#059b4d':'#94a198'};font-weight:${state.tab===t[0]?'700':'400'}">${t[2]}<br>${t[1]}</div>`).join('');
}
function switchTab(t){
  state.tab=t;
  setNav({hall:'课程大厅',mine:'我的课程',schedule:'我的课表',profile:'个人中心'}[t], false);
  renderTabbar();
  const s=document.getElementById('screen'); s.innerHTML='';
  state.stack=[];
  if(t==='hall') renderHall();
  else if(t==='mine') renderMine();
  else if(t==='schedule') renderSchedule();
  else if(t==='profile') renderProfile();
}

/* ---------- 课程大厅 ---------- */
async function renderHall(){
  setNav('课程大厅', false);
  const s=document.getElementById('screen');
  s.innerHTML=`<div class="page">
    <div class="summary"><div><div class="num" id="myNum">–</div><div class="lab">我的课程</div></div><div class="div"></div><div><div class="num" id="openNum">–</div><div class="lab">开放课程</div></div><div class="grow">实时余位 ✓</div></div>
    <div class="section-title"><div><h3>发现课程</h3><div class="sub">报名成功后才占用名额</div></div></div>
    <input class="search" id="hallSearch" placeholder="搜索课程或老师" oninput="onHallSearch()">
    <div class="chips" id="hallCats"></div>
    <div id="hallList"><div class="empty">加载中…</div></div>
  </div>`;
  try{
    const [mine, hall]=await Promise.all([api('GET','/api/me/enrollments'), api('GET','/api/courses?open=1')]);
    document.getElementById('myNum').textContent=(mine.data.items||[]).length+' / '+(mine.data.max_active||2);
    document.getElementById('openNum').textContent=(hall.data.items||[]).length;
    state.hall.cats=hall.data.categories||[];
    state.hall.raw=hall.data.items||[];
    paintCats(); paintHall();
  }catch(e){s.innerHTML='<div class="empty">加载失败：'+(e.message||'')+'</div>';}
}
function paintCats(){
  const c=document.getElementById('hallCats'); if(!c)return;
  const cats=state.hall.cats;
  let h=`<div class="chip ${state.hall.cat===''?'on':''}" onclick="pickCat('')">全部</div>`;
  cats.forEach(x=>h+=`<div class="chip ${state.hall.cat===x?'on':''}" onclick="pickCat('${esc(x)}')">${esc(x)}</div>`);
  h+=`<div class="chip tg ${state.hall.onlyAvail?'on':''}" onclick="toggleAvail()">仅看有余位</div>`;
  c.innerHTML=h;
}
function pickCat(cat){state.hall.cat=cat;paintCats();paintHall();}
function toggleAvail(){state.hall.onlyAvail=!state.hall.onlyAvail;paintCats();paintHall();}
function onHallSearch(){const q=document.getElementById('hallSearch').value.trim().toLowerCase();state.hall.q=q;paintHall();}
function paintHall(){
  const list=document.getElementById('hallList'); if(!list)return;
  let items=(state.hall.raw||[]).filter(c=>{
    if(state.hall.cat && c.category!==state.hall.cat) return false;
    if(state.hall.onlyAvail && c.remaining<=0) return false;
    if(state.hall.q && !(c.name+c.teachers.join('')).toLowerCase().includes(state.hall.q)) return false;
    return true;
  });
  if(!items.length){list.innerHTML='<div class="empty">没有符合条件的课程</div>';return;}
  list.innerHTML=items.map(c=>{
    const tone=toneOf(c.id); const pct=Math.round(c.active_count/c.capacity*100);
    const enrolled=c.enrolled;
    const btn = enrolled?'<button class="pill enrolled">已报名</button>'
      : c.remaining<=0?'<button class="pill full">已满员</button>'
      : '<button class="pill go" onclick="openDetail('+c.id+')">报名</button>';
    return `<div class="ccard" onclick="openDetail(${c.id})">
      <div class="mark" style="background:${TONE_COLOR[tone]}">${esc(c.name.slice(0,1))}</div>
      <div class="body">
        <div class="nm">${esc(c.name)} <span class="badge">${esc(c.category)}</span></div>
        <div class="mt">${esc((c.teachers||[]).join('、')||'待定')} · ${(c.schedules||[]).map(s=>s.slot_name).join('、')||'待定'}</div>
        <div class="foot"><div class="progress"><i style="width:${pct}%"></i></div><div class="remain">余 <b>${c.remaining}</b>/${c.capacity}</div></div>
      </div></div>`;
  }).join('');
}

/* ---------- 详情（overlay） ---------- */
function openDetail(id){
  const ov=el(`<div class="overlay" id="detailOv"></div>`);
  document.getElementById('screen').appendChild(ov);
  state.stack.push(ov);
  setNav('课程详情', true);
  renderTabbar();
  loadDetail(id, ov);
}
async function loadDetail(id, ov){
  try{
    const [d, elg]=await Promise.all([api('GET','/api/courses/'+id), api('GET','/api/courses/'+id+'/eligibility')]);
    const c=d.data.course; const tone=toneOf(c.id);
    let action='<button class="btn" disabled>暂不可报名</button>'; let reason='';
    if(c.enrolled){action='<button class="btn danger" onclick="doWithdraw('+c.id+')">退课</button>';}
    else if(c.status!=='OPEN'){action='<button class="btn" disabled>'+esc(statusText(c.status))+'</button>';}
    else if(c.remaining<=0){action='<button class="btn" disabled>已满员</button>';reason='课程名额已满，可关注后续退课释放';}
    else if(elg.data.eligible===false){action='<button class="btn" disabled>无法报名</button>';reason=elg.data.reason;}
    else {action='<button class="btn" onclick="doEnroll('+c.id+')">报名（余 '+c.remaining+'）</button>';}
    ov.innerHTML=`<div class="navbar" style="position:static"><span class="back" onclick="goBack()">‹ 返回</span><span style="position:absolute;left:0;right:0;text-align:center">课程详情</span></div>
      <div class="screen" style="position:static;overflow-y:auto;flex:1">
        <div class="page">
          <div class="hero" style="background:${TONE_COLOR[tone]}33">
            <div class="mark" style="background:${TONE_COLOR[tone]}">${esc(c.name.slice(0,1))}</div>
            <div><div class="cat">${esc(c.category)}</div><div class="nm">${esc(c.name)}</div><div><span class="badge ${c.status==='OPEN'?'ok':'gray'}">${esc(statusText(c.status))}</span></div></div>
          </div>
          <div class="card">
            <div class="info-row"><span class="k">负责老师</span><span class="v">${esc((c.teachers||[]).join('、')||'待定')}</span></div>
            <div class="info-row"><span class="k">上课时间</span><span class="v">${(c.schedules||[]).map(s=>s.slot_name).join('、')||'待定'}</span></div>
            <div class="info-row"><span class="k">上课场地</span><span class="v">${(c.schedules||[]).map(s=>s.venue_name).join('、')||'待定'}</span></div>
            <div class="info-row"><span class="k">课程容量</span><span class="v">${c.capacity} 人</span></div>
            <div class="info-row"><span class="k">剩余名额</span><span class="v ${c.remaining>0?'ok':'bad'}">${c.remaining} 人</span></div>
          </div>
          <div class="card"><div style="font-weight:700;margin-bottom:8px">课程简介</div><div style="color:#64766c;font-size:14px;line-height:1.8">${esc(c.description||'暂无简介')}</div></div>
          ${reason?`<div class="card alert">${esc(reason)}</div>`:''}
          <div class="spacer"></div>
        </div>
      </div>
      <div class="actionbar">${action}</div>`;
    requestAnimationFrame(()=>ov.classList.add('show'));
  }catch(e){toast(e.message||'加载失败');}
}
function statusText(s){return {OPEN:'开放报名',DRAFT:'草稿',CLOSED:'停止报名',FINISHED:'已结束',ARCHIVED:'已归档'}[s]||s;}
async function doEnroll(id){
  showLoading(true);
  try{
    const r=await api('POST','/api/courses/'+id+'/enroll',{idempotency_key:'web-'+Date.now()+'-'+Math.random().toString(36).slice(2)});
    if(r.code!=='OK'){toast(r.message||'报名失败');return;}
    toast('报名成功');
    const ov=state.stack[state.stack.length-1];
    loadDetail(id, ov);
    if(state.tab==='hall'){const n=document.getElementById('myNum');}
    refreshHallCounts();
  }catch(e){toast(e.message||'网络错误');}
  finally{showLoading(false);}
}
async function doWithdraw(id){
  showLoading(true);
  try{
    const r=await api('DELETE','/api/courses/'+id+'/enrollment');
    if(r.code!=='OK'){toast(r.message||'退课失败');return;}
    toast('已退课');
    const ov=state.stack[state.stack.length-1];
    loadDetail(id, ov);
    refreshHallCounts();
  }catch(e){toast(e.message||'网络错误');}
  finally{showLoading(false);}
}
async function refreshHallCounts(){
  try{
    const [mine,hall]=await Promise.all([api('GET','/api/me/enrollments'),api('GET','/api/courses?open=1')]);
    const mn=document.getElementById('myNum'); if(mn)mn.textContent=(mine.data.items||[]).length+' / '+(mine.data.max_active||2);
    const on=document.getElementById('openNum'); if(on)on.textContent=(hall.data.items||[]).length;
    state.hall.raw=hall.data.items||[]; paintHall();
  }catch(e){}
}

/* ---------- 我的课程 ---------- */
async function renderMine(){
  setNav('我的课程', false);
  const s=document.getElementById('screen'); s.innerHTML='<div class="page"><div class="empty">加载中…</div></div>';
  try{
    const d=await api('GET','/api/me/enrollments');
    const items=d.data.items||[]; const hist=d.data.history||[];
    const max=d.data.max_active||2;
    let h=`<div class="page"><div class="section-title"><div><h3>已报名课程</h3><div class="sub">已选 ${items.length} / ${max} 门</div></div></div>`;
    if(!items.length) h+='<div class="empty">还没有报名课程<br>去「课程」里挑一门吧</div>';
    items.forEach(c=>{
      const tone=toneOf(c.id);
      h+=`<div class="enr" onclick="openDetail(${c.id})">
        <div class="mark" style="background:${TONE_COLOR[tone]}">${esc(c.name.slice(0,1))}</div>
        <div class="body"><div class="nm">${esc(c.name)}</div><div class="mt">${esc((c.teachers||[]).join('、')||'待定')} · ${(c.schedules||[]).map(s=>s.slot_name).join('、')||'待定'}</div></div>
        <button class="quit" onclick="event.stopPropagation();doWithdraw(${c.id})">退课</button></div>`;
    });
    if(hist.length){
      h+='<div class="section-title" style="margin-top:18px"><div><h3>历史记录</h3><div class="sub">退课 / 取消</div></div></div>';
      hist.forEach(x=>{h+=`<div class="hist">${esc(x.name)} · <span class="badge gray">${x.status==='CANCELLED'?'已退课':'已取消'}</span></div>`;});
    }
    h+='</div>';
    s.innerHTML=h;
  }catch(e){s.innerHTML='<div class="empty">加载失败：'+(e.message||'')+'</div>';}
}

/* ---------- 我的课表 ---------- */
async function renderSchedule(){
  setNav('我的课表', false);
  const s=document.getElementById('screen'); s.innerHTML='<div class="page"><div class="empty">加载中…</div></div>';
  try{
    const d=await api('GET','/api/me/schedule');
    const items=d.data.items||[];
    if(!items.length){s.innerHTML='<div class="page"><div class="empty">还没有报名课程<br>课表会在报名后自动生成</div></div>';return;}
    const periods=new Set(); const grid={}; const listMap={};
    items.forEach(it=>{
      const tone=toneOf(it.course_id); const teach=(it.teachers||[]).join('、');
      (it.schedules||[]).forEach(sc=>{
        if(!sc.weekday||!sc.period)return;
        periods.add(sc.period);
        grid[sc.weekday+'-'+sc.period]={course_id:it.course_id,name:it.name,tone,venue:sc.venue_name};
        listMap[(sc.weekday-1)*20+sc.period]={course_id:it.course_id,weekday:sc.weekday,weekdayText:WEEK[sc.weekday-1],period:sc.period,name:it.name,tone,teacher:teach,venue:sc.venue_name};
      });
    });
    const ps=[...periods].sort((a,b)=>a-b);
    const cells=ps.map(p=>WEEK.map((_,i)=>grid[(i+1)+'-'+p]||null));
    const listItems=Object.values(listMap).sort((a,b)=>(a.weekday-b.weekday)||(a.period-b.period));
    s.innerHTML=`<div class="page">
      <div class="section-title"><div><h3>我的课表</h3><div class="sub">已选 ${items.length} 门课程</div></div>
      <div class="seg"><div class="on" id="sg" onclick="switchSched('grid')">课表</div><div id="sl" onclick="switchSched('list')">列表</div></div></div>
      <div id="schedBody"></div></div>`;
    window._sched={ps,cells,listItems};
    paintSched('grid');
  }catch(e){s.innerHTML='<div class="empty">加载失败：'+(e.message||'')+'</div>';}
}
function switchSched(v){
  document.getElementById('sg').classList.toggle('on',v==='grid');
  document.getElementById('sl').classList.toggle('on',v==='list');
  paintSched(v);
}
function paintSched(v){
  const b=document.getElementById('schedBody'); if(!b)return; const d=window._sched;
  if(v==='grid'){
    let h='<div class="tbl"><div class="trow head"><div class="tc corner">节</div>'+WEEK.map(w=>`<div class="tc">${w}</div>`).join('')+'</div>';
    d.cells.forEach((row,i)=>{
      h+='<div class="trow"><div class="tc per">'+d.ps[i]+'</div>';
      row.forEach(c=>{
        h+= c?`<div class="tc" style="background:${TONE_COLOR[c.tone]}1f" onclick="openDetail(${c.course_id})"><div class="cn">${esc(c.name)}</div><div class="cv">${esc(c.venue)}</div></div>`
             :'<div class="tc"></div>';
      });
      h+='</div>';
    });
    h+='</div>';
    b.innerHTML=h;
  }else{
    b.innerHTML=d.listItems.map(it=>`<div class="listitem" style="border-left-color:${TONE_COLOR[it.tone]}" onclick="openDetail(${it.course_id})">
      <div class="when"><div class="day">${it.weekdayText}</div><div class="per">第 ${it.period} 节</div></div>
      <div class="main"><div class="nm">${esc(it.name)}</div><div class="mt">${esc(it.teacher)} · ${esc(it.venue)}</div></div></div>`).join('');
  }
}

/* ---------- 个人中心 ---------- */
async function renderProfile(){
  setNav('个人中心', false);
  const s=document.getElementById('screen');
  const p=state.profile&&state.profile.data?state.profile.data:{};
  s.innerHTML=`<div class="page">
    <div class="profile-head"><div class="avatar">${esc((p.name||'我').slice(0,1))}</div>
      <div><div style="font-size:18px;font-weight:800">${esc(p.name||'—')}</div><div style="font-size:13px;opacity:.8;margin-top:4px">${esc(p.grade||'')} ${esc(p.class_name||'')}</div></div></div>
    <div class="card" style="margin-top:14px">
      <div class="info-row"><span class="k">学号</span><span class="v">${esc(p.student_no||'—')}</span></div>
      <div class="info-row"><span class="k">登录账号</span><span class="v">${esc(p.username||'—')}</span></div>
    </div>
    <div class="menu" style="margin-top:14px">
      <div class="mi" onclick="openChangePwd(false)"><span class="ic">🔑</span>修改密码<span class="arrow">›</span></div>
      <div class="mi" onclick="toast('课程大厅与课表请使用底部标签')"><span class="ic">📚</span>我的课程<span class="arrow">›</span></div>
      <div class="mi" onclick="apiLogout()"><span class="ic">🚪</span>退出登录<span class="arrow">›</span></div>
    </div>
  </div>`;
}
function apiLogout(){state.token=null;state.profile=null;renderLogin();}

/* ---------- 修改密码 overlay ---------- */
let _pwdFirst=false;
function openChangePwd(first){
  _pwdFirst=first;
  const ov=el(`<div class="overlay" id="pwdOv"></div>`);
  document.getElementById('screen').appendChild(ov);
  state.stack.push(ov);
  setNav('修改密码', true); renderTabbar();
  ov.innerHTML=`<div class="navbar" style="position:static"><span class="back" onclick="goBack()">‹ 返回</span><span style="position:absolute;left:0;right:0;text-align:center">修改密码</span></div>
    <div class="screen" style="position:static;overflow-y:auto;flex:1">
      <div class="page">
        ${first?'<div class="card alert" style="background:#fff3dc;border-color:#f0d9a8;color:#8a5100">首次登录，请先设置新密码</div>':''}
        <div class="card" style="margin-top:14px">
          <div class="field" style="border:1px solid var(--line);border-radius:12px;padding:0 14px;height:48px;margin-bottom:12px"><input id="pwd1" type="password" placeholder="新密码（至少8位）" style="border:none;outline:none;width:100%;font-size:15px"></div>
          <div class="field" style="border:1px solid var(--line);border-radius:12px;padding:0 14px;height:48px"><input id="pwd2" type="password" placeholder="确认新密码" style="border:none;outline:none;width:100%;font-size:15px"></div>
          <div class="actionbar"><button class="btn" onclick="submitPwd()">${first?'设置并进入':'保存'}</button></div>
        </div>
      </div>
    </div>`;
  requestAnimationFrame(()=>ov.classList.add('show'));
}
async function submitPwd(){
  const np=document.getElementById('pwd1').value;
  const cp=document.getElementById('pwd2').value;
  if(!np||np.length<8){toast('密码至少8位');return;}
  if(np!==cp){toast('两次输入不一致');return;}
  showLoading(true);
  try{
    const r=await api('POST','/api/auth/change-password',{new_password:np,confirm_password:cp});
    if(r.code!=='OK'){toast(r.message||'修改失败');return;}
    toast('密码已修改');
    // 关闭 overlay
    const ov=state.stack.pop(); if(ov)ov.remove();
    if(_pwdFirst){ state.mustChange=false; enterApp(); }
    else { setNav('个人中心',false); renderTabbar(); renderProfile(); }
  }catch(e){toast(e.message||'网络错误');}
  finally{showLoading(false);}
}

/* ---------- 导航 ---------- */
function setNav(title, showBack){
  document.getElementById('navTitle').textContent=title;
  document.getElementById('navBack').style.display=showBack?'block':'none';
}
function goBack(){
  const ov=state.stack.pop();
  if(ov){ ov.classList.remove('show'); setTimeout(()=>ov.remove(),280); }
  if(state.stack.length===0){ setNav({hall:'课程大厅',mine:'我的课程',schedule:'我的课表',profile:'个人中心'}[state.tab]||'课序', false); renderTabbar(); }
}

/* ---------- 启动 ---------- */
renderLogin();
</script>
