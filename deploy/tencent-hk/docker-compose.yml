name: kexu

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/tencent-hk/Dockerfile
      args:
        PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_MODE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: kexu
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: kexu
      TOKEN_SECRET: ${TOKEN_SECRET}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      APPID: ${APPID:-}
      APPSECRET: ${APPSECRET:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: kexu
      MYSQL_USER: kexu
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
