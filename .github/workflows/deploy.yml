name: Test and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:web

  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure dedicated deployment key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy merged master
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -eu
            cd /home/ubuntu/miniapp
            git checkout master
            git pull --ff-only origin master
            cd deploy/tencent-hk
            sudo docker compose up -d --build
            sudo docker compose ps
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent http://127.0.0.1/api/health >/dev/null; then
                exit 0
              fi
              sleep 5
            done
            sudo docker compose logs --tail=80 app redis mysql
            exit 1
          '
